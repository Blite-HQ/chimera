[project]
name = "chimera-workspace"
version = "0.0.0"
description = "Workspace root — tooling and invariant tests for the Chimera monorepo."
readme = "README.md"
requires-python = ">=3.12"

[tool.uv]
# highspy 1.15.x (dependencia transitiva de cvxpy, vía el extra [gw] de
# blite-cap-graphs y la dependencia directa de chimera-engine) rompe con
# "undefined symbol: _ZN5Highs13releaseMemoryEv" en linux cp312 — ABI
# mismatch en el wheel publicado. HiGHS es un solver LP/MIP y no participa
# en la SDP relaxation que usa el baseline Goemans-Williamson (cvxpy cae a
# Clarabel/SCS), así que fijar una versión que importe limpio es puramente
# cosmético (silencia el log ruidoso de cvxpy) — no cambia ningún resultado.
# 1.14.0 es la versión más alta que importa sin el symbol error (verificado
# 2026-07-24 corriendo scripts/exp_r_vs_p.py end-to-end); 1.15.0 y 1.15.1
# están rotos en esta plataforma.
override-dependencies = ["highspy==1.14.0"]
# dev + experiment son grupos por defecto para que `uv run`/`uv sync` sin
# flags instale matplotlib (necesario para scripts/exp_r_vs_p.py) además de
# las herramientas de desarrollo.
default-groups = ["dev", "experiment"]

[tool.uv.workspace]
members = ["sdk", "engine", "api", "capabilities/*", "distributions/*", "tools/corpus-runner", "tools/convergence", "projectors/otel"]

[tool.uv.sources]
blite-capability = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "mlcroissant>=1.1.0",
]
experiment = ["matplotlib>=3.9"]

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
src = [
    "sdk/src",
    "engine/src",
    "capabilities/solvers/src",
    "capabilities/graphs/src",
    "capabilities/numeric/src",
    "capabilities/sim/src",
    "capabilities/ml/src",
    "capabilities/smt/src",
    "capabilities/quantum/src",
    "capabilities/report/src",
    "capabilities/ingesta/src",
    "capabilities/mcp/src",
    "tools/corpus-runner/src",
    "tools/convergence/src",
    "projectors/otel/src",
    "tests",
]

[tool.ruff.lint]
# S = flake8-bandit (SAST: injection, crypto, subprocess, etc. — OWASP A02/A03/A08)
# ASYNC = flake8-async (blocking calls in async code)
select = ["E", "F", "I", "N", "W", "UP", "B", "S", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# assert is the normal pytest idiom — not a security concern in tests.
"tests/**" = ["S101"]
"*/tests/**" = ["S101"]
# Las queries interpolan SOLO _COLUMNS (constante del módulo); todo parámetro
# viaja por psycopg — no hay vector de inyección (noqa inline no aplica: el
# diagnóstico cae en la línea que abre el f-string triple-quoted).
"engine/src/blite/events/postgres.py" = ["S608"]

[tool.ruff.format]
quote-style = "double"

# ── Pyright ───────────────────────────────────────────────────────────────────

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
# Makes `# type: ignore` negative type-tests load-bearing (e.g. AnchorKind
# excluding "model" — tests/invariants/test_verifier_contract.py): an ignore
# comment that silences nothing becomes a pyright error itself.
reportUnnecessaryTypeIgnoreComment = "error"
# NB: pyright no expande "capabilities/*/src" (un include con glob de un solo
# nivel no matchea — verificado 2026-07-23: analizaba 103 archivos, todos de
# engine/sdk/tests); se incluye el directorio completo.
include = [
    "sdk/src",
    "engine/src",
    # `api/src` entró al gate 2026-08-03 (P-rt): era el único paquete de
    # PRODUCCIÓN fuera del tipado estricto — el runtime y el SDK se revisaban,
    # y la capa que atiende HTTP no. Los 26 errores que destapó se arreglaron
    # en el mismo cambio; 15 eran el falso positivo de FastAPI
    # (`reportUnusedFunction` sobre handlers que registra el decorador,
    # silenciado per-file con su causa) y 11 huecos reales de tipado al
    # recorrer payloads.
    "api/src",
    "capabilities",
    "tools/corpus-runner",
    "tools/convergence",
    "projectors/otel",
    "tests",
]

# ── Pytest + Coverage ─────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "capabilities/*/tests",
    "tools/corpus-runner/tests",
    "tools/convergence/tests",
    "projectors/otel/tests",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "seed: test semilla S-G — xfail(strict=False) hasta que su dueño lo ponga en verde (docs/specs/README.md)",
]
addopts = "--cov --cov-report=term-missing --cov-fail-under=30"

[tool.coverage.run]
source = [
    "blite_capability",
    "blite",
    "chimera_api",
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
    "chimera_eval",
    "chimera_convergence",
    "chimera_otel",
]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
fail_under = 30

# ── Import-Linter — Architecture gates ────────────────────────────────────────
# Contract names must match anchors in docs/invariants.md
# so tests/invariants/test_enforced_anchors.py can verify them.

[tool.importlinter]
root_packages = [
    "blite",
    "blite_capability",
    "chimera_api",
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
    "chimera_eval",
    "chimera_convergence",
    "chimera_otel",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ADR-008: engine never imports capability packages"
type = "forbidden"
source_modules = ["blite"]
forbidden_modules = [
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
]

[[tool.importlinter.contracts]]
name = "ADR-008: capabilities never import engine internals"
type = "forbidden"
source_modules = [
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_ingesta",
    "blite_cap_mcp",
]
forbidden_modules = ["blite"]

[[tool.importlinter.contracts]]
name = "ADR-008-report: the report capability reuses only frozen trust primitives"
type = "forbidden"
# informe-derivado.md / capability-ingesta.md (decisión #69): la familia de
# capabilities de DERIVACIÓN (report aquí; ingesta en B) es una excepción
# DELIBERADA al contrato de cómputo puro de arriba — reutiliza los primitivos
# CONGELADOS del kernel de confianza (blite.verification.*, blite.certificate.*,
# blite.content) porque la identidad de una derivación ES su provenance + digest
# canónico (freeze §7/§12), y "una sola puerta de canonicalización" obliga a usar
# blite.certificate.canonical, no una copia. Pero JAMÁS los internos OPERATIVOS
# del engine — eso convertiría la derivación en un actor con efectos, no en una
# figura/PDF recomputable. Gate explícito para que report no quede CIEGO al
# linter (root_packages lo incluye) — el smell de "contrato implícito" que
# 05-plan-paralelo.md prohíbe.
source_modules = ["blite_cap_report"]
forbidden_modules = [
    "blite.serving",
    "blite.gateway",
    "blite.runtime",
    "blite.authz",
    "blite.protocols",
    "blite.guardrails",
    "blite.events",
    "blite.identity",
]

[[tool.importlinter.contracts]]
name = "S-G: api consumes engine ports, never capability packages"
type = "forbidden"
source_modules = ["chimera_api"]
forbidden_modules = [
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
]

[[tool.importlinter.contracts]]
name = "S-G: engine and capabilities never import the api"
type = "forbidden"
source_modules = ["blite", "blite_capability"]
forbidden_modules = ["chimera_api"]

[[tool.importlinter.contracts]]
name = "INV-2: verification never touches model serving"
type = "forbidden"
source_modules = ["blite.verification"]
forbidden_modules = [
    "blite.serving",
    # PR2 (base lógica): AnchorKind is solver|execution|dataset|rule|human —
    # 'model' is not a representable anchor. Forbid the verifier from
    # reaching any LLM/model client directly, not just the serving module.
    "openai",
    "anthropic",
    "cohere",
    "litellm",
    "transformers",
]

[[tool.importlinter.contracts]]
name = "INV-3: guardrails do not decide egress"
type = "forbidden"
source_modules = ["blite.guardrails"]
forbidden_modules = ["blite.authz", "blite.protocols"]

[[tool.importlinter.contracts]]
name = "AX3: model serving is mediated, never touches the world directly"
type = "forbidden"
# Base lógica AX3: a model never acts on the world directly; every model
# action passes through the gateway port and runs sandboxed. `serving` may
# be *called by* the gateway, but must not itself reach the gateway,
# protocols, authz, runtime, or the network.
source_modules = ["blite.serving"]
forbidden_modules = [
    "blite.protocols",
    "blite.gateway",
    "blite.runtime",
    "blite.authz",
    "httpx",
    "requests",
    "aiohttp",
    "urllib3",
    "socket",
    # Explicit, not just transitive-via-httpx (execution/09 §4, decisión S-F
    # registrada):
    # a model-client SDK in `serving` would be caught by the chain below anyway,
    # but naming it directly keeps the gate legible and doesn't depend on these
    # SDKs continuing to route through httpx internally.
    "litellm",
    "openai",
    "anthropic",
    "cohere",
    "transformers",
]

[[tool.importlinter.contracts]]
name = "AX3-b: model client SDKs are imported only by the protocols adapter (ModelServer)"
type = "forbidden"
# Decision S-F registrada + stress test pre-B: litellm/openai/anthropic are now real
# engine deps (multi-provider router, kept per Steven+Dylan). AX3 guards
# `serving` and INV-2 guards `verification`; this closes the gap so NO other
# engine module can import a model SDK and bypass mediation. Only
# `blite.protocols` (ModelServer, contract-freeze.md §15.7) may wrap the SDK.
source_modules = [
    "blite.gateway",
    "blite.runtime",
    "blite.authz",
    "blite.guardrails",
    "blite.verification",
    "blite.certificate",
    "blite.identity",
    "blite.events",
]
forbidden_modules = [
    "litellm",
    "openai",
    "anthropic",
    "cohere",
    "transformers",
]

[[tool.importlinter.contracts]]
name = "P11: the JobQueue port stays a port — the engine never imports procrastinate"
type = "forbidden"
# #148 entregó `blite.runtime.jobs` (el puerto `JobQueue`) con una regla
# explícita: «`blite.runtime` no importa `procrastinate` — mismo principio que
# `ModelPort` con litellm (AX3-b): la casa legítima del SDK está afuera del
# runtime». P11 escribió esa casa (`chimera_api.jobs`, la app del worker) y
# este contrato convierte la regla en un trinquete: si un día el adapter se
# colara dentro del engine, el puerto habría dejado de ser un puerto y el
# runtime tendría una cola concreta cableada adentro. La flecha legítima es
# api→procrastinate, y por eso `chimera_api` NO está en la lista.
source_modules = ["blite", "blite_capability"]
forbidden_modules = ["procrastinate"]

[[tool.importlinter.contracts]]
name = "Inv-E: egress is governed only by authorization, never by verification"
type = "forbidden"
# Base lógica Inv-E: "el egreso lo gobierna SOLO la autorización... ninguna
# otra propiedad, en particular la verificación, satisface el antecedente de
# un egreso." The egress path (protocols, authz) must not import
# verification or guardrails — this closes the prompt-injection vector where
# a "verification" outcome could be used to justify egress.
source_modules = ["blite.protocols", "blite.authz"]
forbidden_modules = ["blite.verification", "blite.guardrails"]

[[tool.importlinter.contracts]]
name = "INV-5: non-events modules cannot write to event log"
type = "forbidden"
source_modules = [
    "blite.gateway",
    "blite.runtime",
    "blite.serving",
    "blite.verification",
    "blite.guardrails",
    "blite.authz",
    "blite.protocols",
    "blite.certificate",
    "blite.identity",
]
forbidden_modules = ["blite.events.writer", "blite.events.postgres"]

[[tool.importlinter.contracts]]
name = "organization: only blite.organization writes projects via postgres"
type = "forbidden"
# F1.1 (docs/mejorado/09-cierre.md §2·F1, ceremonia #176): análogo a INV-5
# arriba, mismo motivo — `blite.organization.postgres` es el adapter DURABLE
# de `ProjectRepository`; el resto del engine recibe el repositorio vía
# `blite.organization.create_project_repository()`, jamás importando el
# adapter directo (docstring `blite/organization/postgres.py:1-13`).
source_modules = [
    "blite.gateway",
    "blite.runtime",
    "blite.serving",
    "blite.verification",
    "blite.guardrails",
    "blite.authz",
    "blite.protocols",
    "blite.certificate",
    "blite.identity",
    "blite.events",
]
forbidden_modules = ["blite.organization.postgres"]

[[tool.importlinter.contracts]]
name = "INV-6: egress protocols sit above authz in the dependency hierarchy"
type = "layers"
layers = [
    "blite.protocols",
    "blite.authz",
]

[[tool.importlinter.contracts]]
name = "M2/C-5: the gateway is injected into the runtime — runtime never imports gateway"
type = "layers"
# freeze §8 (supersede C-5/#106): el Pipeline se INYECTA en execute_run (como
# proposer). El runtime define el seam (CrossingRequest/CrossingRejected/
# GatewayCrossing) y el adapter vive en blite.gateway.crossing — la dirección
# permitida es gateway→runtime (capa alta importa baja), jamás al revés.
layers = [
    "blite.gateway",
    "blite.runtime",
]

[[tool.importlinter.contracts]]
name = "SDK-standalone: the SDK never imports the engine or any capability package"
type = "forbidden"
# Extraction precondition (plan §1.A): blite_capability is the ONLY shared
# interface between engine and capabilities. It must remain importable on its
# own so the future repo split (engine+sdk → PyPI) stays mechanical.
source_modules = ["blite_capability"]
forbidden_modules = [
    "blite",
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
]

[[tool.importlinter.contracts]]
name = "O8: evaluation is downstream — nothing imports the corpus runner"
type = "forbidden"
# El TERCER plano (evaluación agregada, offline) mide el sistema; el sistema
# jamás depende de él. Si un día `blite` o `chimera_api` importaran
# `chimera_eval`, una métrica retrospectiva habría entrado al camino crítico de
# un run — exactamente la confusión eval≈verificación que el marco de los tres
# planos existe para evitar (docs/tres-planos.md · knowledge/trust/17 §1.6).
# La flecha inversa SÍ es legítima y por eso no se prohíbe: la tarea
# `chimera_eval.tasks.verification_plane` importa el plano de verificación para
# medirlo.
source_modules = [
    "blite",
    "blite_capability",
    "chimera_api",
    "blite_cap_solvers",
    "blite_cap_graphs",
    "blite_cap_numeric",
    "blite_cap_sim",
    "capabilities_sim_api",
    "blite_cap_ml",
    "blite_cap_smt",
    "blite_cap_quantum",
    "blite_cap_report",
    "blite_cap_ingesta",
    "blite_cap_mcp",
]
forbidden_modules = ["chimera_eval"]

[[tool.importlinter.contracts]]
name = "O9: el auditor de convergencia es un instrumento de PROCESO, aislado"
type = "forbidden"
# `chimera_convergence` audita cómo DECIDIMOS, no lo que el sistema hace. La
# flecha en cualquiera de los dos sentidos sería un error distinto y ambos
# graves: que el producto lo importara metería una herramienta de proceso en el
# camino crítico de un run; que él importara el producto ataría un método
# general —aplicable a dos revisiones de cualquier cosa— a ESTE dominio.
source_modules = ["chimera_convergence"]
forbidden_modules = [
    "blite",
    "blite_capability",
    "chimera_api",
    "chimera_eval",
    "chimera_otel",
]

[[tool.importlinter.contracts]]
name = "C-11: the OTel projector never imports the engine"
type = "forbidden"
# El exportador OTLP es EGRESO. Dentro de `blite` chocaría con Inv-E/INV-6, así
# que el proyector es un proceso aparte que parsea el WIRE — el mismo desacople
# que el Studio (docs/specs/observabilidad-proyeccion.md §1). Si esta flecha
# apareciera, la frontera se habría perdido en silencio.
source_modules = ["chimera_otel"]
forbidden_modules = [
    "blite",
    "blite_capability",
    "chimera_api",
]

[[tool.importlinter.contracts]]
name = "C-11: nothing depends on the OTel projector"
type = "forbidden"
# Y al revés: la observabilidad es opcional (perfil del compose). Un proyector
# caído jamás debe poder afectar un run.
source_modules = [
    "blite",
    "blite_capability",
    "chimera_api",
]
forbidden_modules = ["chimera_otel"]
