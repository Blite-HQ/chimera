<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chimera Studio — pseudo-mockups de layout v1</title>
    <style>
      /* Tokens calcados de DESIGN.md (solo dark — el sistema es dark-first).
     Esto es un WIREFRAME de layout: la estética final la manda apps/studio. */
      :root {
        --bg: #0a0a0a;
        --surface: #171717;
        --surface-2: #262626;
        --border: rgba(255, 255, 255, 0.1);
        --text: #fafafa;
        --muted: #a3a3a3;
        --brand: #2dd4bf;
        --pass: #34d399;
        --fail: #f87171;
        --warn: #fbbf24;
        --info: #38bdf8;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        padding-bottom: 64px; /* espacio para la barra del mockup */
      }
      a {
        color: inherit;
      }
      code,
      .mono {
        font-family: var(--mono);
      }

      /* ── primitivas de wireframe ───────────────────────────── */
      .wf {
        background:
          repeating-linear-gradient(45deg, transparent 0 6px, rgba(255, 255, 255, 0.04) 6px 12px),
          var(--surface);
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .xs {
        font-size: 12px;
      }
      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .grow {
        flex: 1;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--text);
        color: var(--bg);
        border-color: transparent;
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--muted);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 12px;
        border: 1px solid var(--border);
        white-space: nowrap;
      }
      .badge.pass {
        background: rgba(52, 211, 153, 0.12);
        border-color: rgba(52, 211, 153, 0.4);
        color: var(--pass);
      }
      .badge.fail {
        background: rgba(248, 113, 113, 0.12);
        border-color: rgba(248, 113, 113, 0.4);
        color: var(--fail);
      }
      .badge.inconclusive {
        border-style: dashed;
        color: var(--muted);
      }
      .badge.neutral {
        color: var(--muted);
      }
      .badge .lvl {
        font-family: var(--mono);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        flex: none;
      }
      .dot.ok {
        background: var(--pass);
      }
      .dot.run {
        background: var(--warn);
        animation: pulse 1.2s infinite;
      }
      .dot.bad {
        background: var(--fail);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* escala AL: 5 barras ascendentes, solo la alcanzada en color */
      .scale {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 16px;
      }
      .scale i {
        width: 4px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 1px;
      }
      .scale i.on {
        background: var(--pass);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        text-align: left;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 500;
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
      }
      td {
        padding: 12px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      tr.click:hover {
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
      }
      tr.ghost {
        opacity: 0.45;
      }

      /* ── shell A: topbar (Vercel) ──────────────────────────── */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        border-bottom: 1px solid var(--border);
        background: rgba(10, 10, 10, 0.9);
        backdrop-filter: blur(8px);
      }
      .topbar .inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 0 32px;
        height: 64px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        white-space: nowrap;
      }
      .logomark {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 18px;
        align-self: center;
      }
      .logomark i {
        width: 4px;
        background: var(--brand);
        border-radius: 1px;
      }
      .brand b {
        font-weight: 500;
        font-size: 17px;
        letter-spacing: -0.02em;
      }
      .brand small {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--muted);
      }
      .projswitch {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .projswitch .mono {
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        height: 100%;
      }
      .tabs a {
        display: flex;
        align-items: center;
        padding: 0 8px;
        font-size: 13.5px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 2px solid transparent;
      }
      .tabs a.on {
        color: var(--text);
        border-bottom-color: var(--brand);
      }
      .tabs a:hover {
        color: var(--text);
      }

      /* ── shell B: sidebar (Claude / Discovery) ─────────────── */
      .layoutB {
        display: flex;
        min-height: calc(100vh - 64px);
      }
      .sidebar {
        width: 240px;
        flex: none;
        border-right: 1px solid var(--border);
        padding: 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        position: sticky;
        top: 0;
        height: 100vh;
      }
      .sidebar .navsec {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .sidebar .navsec a {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13.5px;
        color: var(--muted);
        text-decoration: none;
      }
      .sidebar .navsec a.on {
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        box-shadow: inset 2px 0 0 var(--brand);
      }
      .sidebar .navsec a:hover {
        color: var(--text);
      }
      .sidebar .foot {
        margin-top: auto;
      }
      .slimbar {
        height: 48px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px;
      }

      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 32px;
      }
      .container.narrow {
        max-width: 768px;
      }

      /* run header + sub-tabs */
      .runhead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 16px;
      }
      .subtabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin-top: 16px;
      }
      .subtabs a {
        padding: 8px 10px;
        font-size: 13.5px;
        color: var(--muted);
        text-decoration: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .subtabs a.on {
        color: var(--text);
        border-bottom-color: var(--brand);
      }

      /* timeline + inspector */
      .split {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .aside {
        width: 384px;
        flex: none;
        position: sticky;
        top: 88px;
      }
      .evt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        cursor: pointer;
      }
      .evt:hover {
        background: rgba(255, 255, 255, 0.03);
      }
      .evt.sel {
        border-color: var(--brand);
        background: rgba(45, 212, 191, 0.06);
      }
      .evt .seq {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        width: 24px;
      }
      .evt .type {
        font-family: var(--mono);
        font-size: 13px;
      }
      .evt .indent {
        width: 20px;
        flex: none;
        border-left: 1px solid var(--border);
        align-self: stretch;
        margin-left: 12px;
      }

      .digest {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        padding: 4px 0;
      }
      .digest code {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 200px;
      }

      .accordion {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }
      .accordion .head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        cursor: pointer;
        flex-wrap: wrap;
      }
      .accordion .body {
        border-top: 1px solid var(--border);
        padding: 12px;
      }

      .kv {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .kv:last-child {
        border-bottom: none;
      }
      .kv .v {
        font-family: var(--mono);
        font-size: 12px;
        text-align: right;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 60%;
      }

      /* papers: lista + detalle */
      .papers {
        display: flex;
        gap: 24px;
        align-items: flex-start;
      }
      .paperlist {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .paperitem {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
      }
      .paperitem.sel {
        border-color: var(--brand);
      }
      .dropzone {
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }

      /* notas del mockup */
      .notes {
        border: 1px dashed rgba(251, 191, 36, 0.5);
        background: rgba(251, 191, 36, 0.06);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 24px;
        font-size: 13px;
      }
      .notes b {
        color: var(--warn);
        font-weight: 500;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .notes ul {
        margin: 6px 0 0;
        padding-left: 18px;
        color: var(--muted);
      }
      .notes li {
        margin: 2px 0;
      }
      body.no-notes .notes {
        display: none;
      }

      /* barra de control del mockup */
      #mockbar {
        position: fixed;
        inset: auto 0 0 0;
        z-index: 50;
        background: #000;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        flex-wrap: wrap;
      }
      #mockbar .tag {
        font-family: var(--mono);
        font-size: 10px;
        letter-spacing: 0.15em;
        color: var(--warn);
        border: 1px solid rgba(251, 191, 36, 0.4);
        border-radius: 4px;
        padding: 2px 6px;
      }
      #mockbar button {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        cursor: pointer;
      }
      #mockbar button.on {
        color: var(--text);
        border-color: var(--brand);
      }
      #mockbar .sep {
        width: 1px;
        height: 20px;
        background: var(--border);
        margin: 0 4px;
      }
      #mockbar .hint {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <nav id="mockbar" aria-label="Controles del mockup">
      <span class="tag">MOCKUP&nbsp;V1</span>
      <span class="sep"></span>
      <span id="screenBtns" style="display: flex; gap: 8px; flex-wrap: wrap"></span>
      <span class="sep"></span>
      <button data-shell="A">shell A · topbar</button>
      <button data-shell="B">shell B · sidebar (dirección actual)</button>
      <span class="sep"></span>
      <button id="notesToggle" class="on">notas</button>
      <span class="hint">teclas: 1–6 pantallas · S shell · N notas · solo dark (dark-first)</span>
    </nav>

    <script>
      /* ────────────────────────────────────────────────────────────
   Pseudo-mockup de layout — Chimera Studio (carril 2, fase 1).
   Datos: bundle real scripts/example-bundle.json (run 8f2c1a9b).
   Las filas marcadas "(ejemplo)" ilustran estados sin datos reales.
   ──────────────────────────────────────────────────────────── */

      const state = { screen: 'runs', shell: 'B', notes: true };

      /* ── helpers de componentes ── */
      const scale = lvl => {
        const bars = [6, 8, 10, 13, 16]
          .map((h, i) => `<i style="height:${h}px" class="${i === lvl ? 'on' : ''}"></i>`)
          .join('');
        return `<span class="scale" role="img" aria-label="nivel AL${lvl} de AL4">${bars}</span>`;
      };
      const alBadge = (clase, lvl, tone = 'pass') =>
        `<span class="badge ${tone}">${scale(lvl)} ${clase} · <span class="lvl">AL${lvl}</span></span>`;
      const verdictBadge = v =>
        ({
          pass: '<span class="badge pass">pass</span>',
          fail: '<span class="badge fail">fail</span>',
          inconclusive: '<span class="badge inconclusive">inconclusive</span>',
          none: '<span class="badge neutral">—</span>'
        })[v];

      /* ── shells ── */
      const PROJECT_TABS = [
        ['runs', 'Runs'],
        ['artifacts', 'Artifacts'],
        ['papers', 'Papers'],
        ['knowledge', 'Knowledge']
      ];

      function brandHtml() {
        return `<span class="brand">
    <span class="logomark"><i style="height:8px"></i><i style="height:13px"></i><i style="height:18px"></i></span>
    <b>Chimera</b><small>STUDIO</small>
  </span>`;
      }
      function projSwitchHtml() {
        return `<span class="projswitch"><span class="muted">proyecto</span>
    <span class="mono">islanding-ieee14</span> <span class="muted">▾</span></span>`;
      }
      function themeToggleHtml() {
        return `<button class="btn ghost" title="Tema" aria-label="Cambiar tema">◐</button>`;
      }

      function shellA(inner, activeNav) {
        const tabs = PROJECT_TABS.map(
          ([id, label]) =>
            `<a href="#" data-goto="${id}" class="${activeNav === id ? 'on' : ''}">${label}</a>`
        ).join('');
        return `
    <header class="topbar"><div class="inner">
      ${brandHtml()} ${projSwitchHtml()}
      <nav class="tabs grow" aria-label="Secciones del proyecto">${tabs}</nav>
      ${themeToggleHtml()}
    </div></header>
    <main>${inner}</main>`;
      }

      function shellB(inner, activeNav) {
        const nav = PROJECT_TABS.map(
          ([id, label]) =>
            `<a href="#" data-goto="${id}" class="${activeNav === id ? 'on' : ''}">${label}</a>`
        ).join('');
        return `
    <div class="layoutB">
      <aside class="sidebar">
        ${brandHtml()}
        ${projSwitchHtml()}
        <nav class="navsec" aria-label="Secciones del proyecto">
          <span class="eyebrow" style="padding:4px 10px">Proyecto</span>
          ${nav}
        </nav>
        <div class="foot row">${themeToggleHtml()}<span class="xs muted">tema</span></div>
      </aside>
      <div class="grow">
        <div class="slimbar xs muted">islanding-ieee14 <span>/</span> <span id="crumb"></span></div>
        <main>${inner}</main>
      </div>
    </div>`;
      }

      /* ── fragmentos de run (header + sub-tabs) ── */
      function runHeader() {
        return `
    <div class="xs muted" style="margin-bottom:8px">
      <a href="#" data-goto="runs" style="color:var(--muted)">runs</a> / <span class="mono">8f2c1a9b</span>
    </div>
    <div class="runhead">
      <span class="dot ok"></span>
      <h1 class="mono" style="font-size:22px;font-weight:500">8f2c1a9b</h1>
      <span class="badge neutral">completado</span>
      ${alBadge('formal exacto', 3)}
      <span class="grow"></span>
      <button class="btn">Ver certificado</button>
      <button class="btn">Descargar bundle</button>
    </div>
    <div class="xs muted" style="margin-top:8px">
      user:dylan · 2026-07-22 12:00 · 5 s · 5 eventos · dominio <span class="mono">d-default</span>
      · política <span class="mono">verification-default.yaml</span>
    </div>`;
      }
      function runTabs(active) {
        const tabs = [
          ['timeline', 'Timeline'],
          ['verificacion', 'Verificación'],
          ['red', 'Red'],
          ['ablacion', 'Ablación'],
          ['procedencia', 'Procedencia']
        ];
        return `<nav class="subtabs" aria-label="Vistas del run">${tabs
          .map(([id, label]) => {
            const goto = id === 'timeline' || id === 'verificacion' ? `data-goto="${id}"` : '';
            return `<a href="#" ${goto} class="${active === id ? 'on' : ''}">${label}</a>`;
          })
          .join('')}</nav>`;
      }

      /* ── pantallas ── */
      const SCREENS = {
        /* S1 — proyecto: lista de runs */
        runs: {
          label: '1 · Runs (lista)',
          nav: 'runs',
          crumb: 'runs',
          notes: [
            'DECISIÓN PROVISIONAL (Dylan, 2026-07-23): la dirección de trabajo es el shell B (sidebar). El shell A se conserva en este mockup solo para comparar — valide con el equipo y se cierra la decisión.',
            'Referencia de layout: lista de deployments de Vercel — tabla densa a todo el ancho, una fila = un run, click en la fila abre el run.',
            'Solo la fila 8f2c1a9b es real (bundle de ejemplo); las filas atenuadas ilustran los estados en-curso / refutado.',
            'La confianza (clase + AL) es columna de primera clase — nunca se muestra un run sin su badge.',
            'A validar: ¿el header del proyecto merece más (descripción, métricas agregadas) o así de seco está bien?',
            'A validar: filtros como selects sueltos vs barra de filtros persistente.'
          ],
          content: () => `
      <div class="container">
        <div class="row" style="margin-bottom:4px">
          <h1 style="font-size:24px;font-weight:500;letter-spacing:-.02em">Runs</h1>
          <span class="grow"></span>
          <button class="btn primary">Nuevo run</button>
        </div>
        <p class="muted" style="margin-bottom:16px">
          Partición de islas de la red IEEE 14 — lo cuántico propone, las anclas verifican.
        </p>
        <div class="row" style="margin-bottom:16px">
          <input placeholder="Busque por run_id o conclusión…" style="flex:1;max-width:320px;height:32px;
            background:transparent;border:1px solid var(--border);border-radius:8px;padding:0 12px;color:var(--text)" />
          <button class="btn">Estado ▾</button>
          <button class="btn">Veredicto ▾</button>
        </div>
        <div class="card" style="overflow:hidden">
          <table>
            <thead><tr>
              <th>Run</th><th>Conclusión</th><th>Veredicto</th><th>Confianza</th>
              <th>Eventos</th><th>Actor</th><th>Fecha</th>
            </tr></thead>
            <tbody>
              <tr class="click" data-goto="timeline">
                <td><span class="row"><span class="dot ok"></span><code>8f2c1a9b</code></span></td>
                <td>Partición óptima exacta del corte (ieee14)</td>
                <td>${verdictBadge('pass')}</td>
                <td>${alBadge('formal exacto', 3)}</td>
                <td class="mono xs">5</td>
                <td class="mono xs">user:dylan</td>
                <td class="xs muted">hace 1 día</td>
              </tr>
              <tr class="ghost">
                <td><span class="row"><span class="dot run"></span><code>(ejemplo)</code></span></td>
                <td class="muted">Run en curso — la fila muestra progreso en vivo (SSE)</td>
                <td>${verdictBadge('none')}</td>
                <td><span class="badge neutral">pendiente</span></td>
                <td class="mono xs">12</td>
                <td class="mono xs">user:steven</td>
                <td class="xs muted">hace 5 min</td>
              </tr>
              <tr class="ghost">
                <td><span class="row"><span class="dot bad"></span><code>(ejemplo)</code></span></td>
                <td class="muted">Run con conclusión refutada por las anclas</td>
                <td>${verdictBadge('fail')}</td>
                <td>${alBadge('ejecución', 3, 'fail')}</td>

          .forEach(b => b.classList.toggle('on', b.dataset.screen === state.screen));

          b.dataset.screen = id;

            render();
          };
          holder.appendChild(b);
        });

            state.shell = b.dataset.shell;
            render();
          })
        );
        document.getElementById('notesToggle').addEventListener('click', e => {
          state.notes = !state.notes;
          e.currentTarget.classList.toggle('on', state.notes);
          render();
        });

        if (goto) {

          state.screen = goto.dataset.goto;
          render();

      });

        if (e.target.tagName === 'INPUT') return;
        const keys = {
          1: 'runs',
          2: 'timeline',
          3: 'verificacion',
          4: 'artifacts',
          5: 'papers',
          6: 'knowledge'
