# Excepciones DECLARADAS del gate de agnosticismo multi-capa (O11).
#
# Este archivo es el mapa honesto de dónde el vocabulario del reto 1 sigue
# metido en capas que deberían ser genéricas. Cada entrada dice DÓNDE, QUÉ
# término, de qué CLASE es y QUÉ la mata:
#
#   doctrina — la regla citándose a sí misma (no muere: es el contraejemplo).
#   contrato — identificador YA estampado en bundles/attestations emitidos.
#              Renombrarlo re-digesta evidencia firmada ⇒ ceremonia, jamás
#              un rename de conveniencia.
#   deuda    — fuga real. Obliga a citar el ítem de backlog que la cierra.
#
# El gate es un TRINQUETE: una fuga nueva sin declarar lo rompe, y una
# excepción que deja de matchear también (se borra). La lista solo encoge.
#
# Añadir una entrada NO es el camino barato: el arreglo por defecto es sacar el
# término del código genérico (a `capabilities/`, a `lenses/`, a datos, o
# reformulándolo).

# ── sdk ───────────────────────────────────────────────────────────────────────

[[exception]]
path = "sdk/src/blite_capability/manifest.py"
terms = ["islanding", "water quality"]
kind = "doctrina"
causa = """
El docstring de `CapabilityManifest` ENSEÑA ADR-029 citando los términos
prohibidos como contraejemplo ("Terms like 'islanding', 'grid', 'water
quality'…" + un `id=` de ejemplo marcado como violación).
"""
muere_con = "nunca — es la regla explicándose a sí misma en el archivo que la define"

# ── engine ────────────────────────────────────────────────────────────────────

[[exception]]
path = "engine/src/blite/verification/execution.py"
terms = ["islanding"]
kind = "contrato"
causa = """
`HARNESS_ID = "pandapower-islanding-v1"` viaja DENTRO de las attestations que
el ExecutionVerifier ya emitió: el id es parte de la evidencia canonicalizada.
Renombrarlo cambia el digest de bundles estampados.
"""
muere_con = "ceremonia de supersede del identificador de harness (freeze §4) — jamás un rename suelto"

[[exception]]
path = "engine/src/blite/verification/execution.py"
terms = ["pandapower", "ieee14"]
kind = "deuda"
causa = """
`ExecutionVerifier` es un verificador de DOMINIO (AL3, flujo de potencia) que
vive en `blite.verification` — el mismo patrón que ADR-008 le prohíbe a los
solvers, sin ADR que justifique la asimetría (censo 07 §8.3, fila `engine`).
Está declarado con honestidad, pero la UBICACIÓN es la fuga.
"""
muere_con = "G3 (dispatch por clase) o verificador hermano en `capabilities/` — 04-consolidacion §4 G3"

[[exception]]
path = "engine/src/blite/verification/external_evidence.py"
terms = ["islanding"]
kind = "deuda"
causa = "Docstring que cita el corpus del reto 1 como procedencia de una determinación empírica del caller."
muere_con = "reformulación de la prosa (fuga de docstring, no de comportamiento) — censo 07 §8.3"

[[exception]]
path = "engine/src/blite/verification/ground_truth.py"
terms = ["islanding"]
kind = "deuda"
causa = "Docstring que ancla la doctrina del veredicto al corpus del reto 1 (receta 11 §5.1)."
muere_con = "reformulación de la prosa (fuga de docstring, no de comportamiento) — censo 07 §8.3"

[[exception]]
path = "engine/src/blite/verification/exact_diagonalization.py"
terms = ["pandapower"]
kind = "deuda"
causa = "Comentario que explica de qué dependencia DIRECTA llega numpy — nombra la librería de dominio para justificar «cero deps nuevas» (#135)."
muere_con = "reformulación de la prosa cuando la dep deje de llegar por esa vía — censo 07 §8.3"

[[exception]]
path = "engine/src/blite/verification/property_rule.py"
terms = ["pandapower"]
kind = "deuda"
causa = "Mismo comentario de procedencia de numpy que `exact_diagonalization.py`."
muere_con = "reformulación de la prosa cuando la dep deje de llegar por esa vía — censo 07 §8.3"

