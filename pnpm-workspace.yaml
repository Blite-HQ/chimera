packages:
  - 'apps/*'

# Supply-chain quarantine: a newly published version must be at least 14 days
# old (in minutes: 20160) before pnpm will resolve to it. Compromised releases
# are typically detected and unpublished within days; known-CVE fixes still
# arrive via Dependabot security updates, which bypass cooldowns.
minimumReleaseAge: 20160
# Some packages lack registry time metadata; 'highest' keeps the age check
# (warn+skip on missing metadata) instead of failing resolution outright.
resolutionMode: highest

# Excepción puntual (NO es el override global prohibido): esta versión exacta
# ya está fijada en pnpm-lock.yaml y en uso; pnpm re-valida deps transitivas
# existentes al agregar paquetes nuevos y bloquearía cualquier instalación
# hasta que madure. Quitar cuando @tailwindcss/oxide 4.3.2 cumpla 14 días.
#
# ignore / es-toolkit: no son la dependencia vulnerable — son colateral de
# Dependabot's security-update attempts para js-yaml (GHSA-52cp-r559-cp3m,
# alerta #15) y fast-uri (GHSA-v2hh-gcrm-f6hx, alerta #16). El registry real
# de npm SÍ trae "time" completo para ambos (verificado directo contra
# registry.npmjs.org); es el proxy sandboxeado del updater de Dependabot el
# que no lo está pasando, y minimumReleaseAge revienta con
# ERR_PNPM_MISSING_TIME al re-validar el árbol transitivo en vez de solo
# saltarse el paquete (resolutionMode: highest no cubre este caso — bug
# conocido, ver pnpm/pnpm#9963 y dependabot/dependabot-core#13165). Ambos
# intentos de Dependabot fallaron con security_update_not_possible por esto.
# Quitar si dependabot-core#13165 se resuelve upstream.
minimumReleaseAgeExclude:
  - '@tailwindcss/oxide*'
  - '@rolldown/binding*'
  - '@types/node'
  - 'ignore'
  - 'es-toolkit'

# pnpm 11 blocks dependency install scripts by default (replaces
# onlyBuiltDependencies). Keep this allowlist minimal — every entry here is
# third-party code that runs at install time.
allowBuilds:
  esbuild: true
