  <rect width="32" height="32" rx="7" fill="#111823" />
  <rect x="6" y="7" width="5.5" height="18" rx="1.5" fill="#E9A94F" />
  <rect x="13.25" y="13" width="5.5" height="12" rx="1.5" fill="#E9A94F" />
  <rect x="20.5" y="19" width="5.5" height="6" rx="1.5" fill="#E9A94F" />
</svg>
