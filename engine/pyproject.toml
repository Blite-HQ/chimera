[project]
name = "blite-engine"
version = "0.1.0"
description = "Blite Engine — agentic execution core with anchored verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite"]

[tool.uv.sources]
blite-capability = { workspace = true }
