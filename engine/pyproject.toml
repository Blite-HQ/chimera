[project]
name = "chimera-engine"
version = "0.1.0"
description = "Chimera engine — agentic execution core with anchored verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
    "pydantic>=2.9",
    "cryptography>=43",
    "pyyaml>=6.0",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "psycopg[binary,pool]>=3.3.4",
    "litellm>=1.93.0",
    "ortools>=9.15.6755",
    "pandapower>=3.5.4",
    "cvxpy>=1.9.2",
    "pyjwt>=2.13.0",
    # z3 (MIT) es el backend formal del ancla `rule` (C3/M3, freeze §4 —
    # `blite.verification.rule_z3`). Va como dependencia DIRECTA del engine,
    # igual que ortools para `formal_exact` y pandapower para `execution`:
    # el adapter del ancla vive en el engine (ADR-008 prohíbe importar
    # capabilities), así que el engine debe declarar lo que importa. Que la
    # distribución ya lo instalara vía `blite-cap-smt[z3]` no lo declaraba:
    # era una dependencia implícita que se rompía al instalar el engine solo.
    "z3-solver>=4.16",
]

[project.optional-dependencies]
# El SDK de MCP solo hace falta cuando el despliegue declara un servidor
# externo en su `DistributionManifest` (O5/M13). Extra, no dependencia base:
# un despliegue sin interop no debe pagar la superficie de un cliente de
# protocolo que nunca va a usar.
mcp = ['mcp>=1.2']

[dependency-groups]
dev = [
    "hypothesis>=6.156.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite"]

[tool.uv.sources]
blite-capability = { workspace = true }
