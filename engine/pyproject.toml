[project]
name = "chimera-engine"
version = "0.1.0"
description = "Chimera engine — agentic execution core with anchored verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
    "pydantic>=2.9",
    "cryptography>=43",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite"]

[tool.uv.sources]
blite-capability = { workspace = true }
