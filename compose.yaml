# Chimera — compose canónico del mes (freeze §15.4: todo LOCAL, sin AWS/cloud).
#
# Cuatro servicios de primera clase: postgres + api + worker + studio.
# `ollama` queda FUERA de este compose (perfil opcional archivado — EG-1).
#
# Custodia de credenciales EG-3/EG-4: NUNCA una contraseña literal en este
# YAML. El servicio `postgres` recibe la suya vía `POSTGRES_PASSWORD_FILE`
# (soportado nativamente por la imagen oficial); `api`/`worker` reciben el
# *_FILE por convención y `docker/api-entrypoint.sh` (infra-owned, sin tocar
# engine/) arma `CHIMERA_DATABASE_URL` en runtime.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: chimera
      POSTGRES_DB: chimera
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
      - otel_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./engine/sql/init_v2.sql:/docker-entrypoint-initdb.d/10-init_v2.sql:ro
      # Rol SOLO-SELECT del proyector (perfil `otel`). Corre solo sobre un
      # volumen NUEVO — en uno ya inicializado, `docker compose exec`.
      - ./docker/otel-grants-init.sh:/docker-entrypoint-initdb.d/20-otel-grants.sh:ro
    ports:
      # Solo loopback: tests de integración corridos en el host
      # (CHIMERA_TEST_DATABASE_URL) contra el Postgres del compose. 5544
      # evita chocar con un Postgres local en 5432.
      - '127.0.0.1:5544:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chimera']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # *_FILE únicamente — el valor real nunca vive en este YAML (EG-3).
      CHIMERA_DB_PASSWORD_FILE: /run/secrets/postgres_password
      # F1.3 — permisos del operador local (`chimera_api.auth`). Setear esta
      # var REEMPLAZA el default entero (`_DEFAULT_OPERATOR_PERMISSIONS`), así
      # que acá van los tres de siempre MÁS `override:apply:run`: sin él,
      # `POST /runs/{id}/approvals/{id}` da 403 fail-closed (el default de
      # código NO lo trae — decisión deliberada, `chimera_api.chat`
      # `_APPROVAL_SCOPE`). Este despliegue local declara explícito que quiere
      # responder aprobaciones desde el Studio; nadie las aprueba por
      # accidente.
      CHIMERA_OPERATOR_PERMISSIONS: 'capability:invoke,capability:ingest:external-source,capability:ingest:derive,override:apply:run'
      # Flip del agente real (P4, decisión #92 · el camino dorado de
      # docs/archivo/planeado/01-demo-dia-d.md: "el agente es real... en
      # escena corre por defecto en replay — reproducción determinista de
      # una sesión agéntica real grabada"). SIN activar por default — ausente ⇒ el proposer
      # placeholder determinista actual (comportamiento intacto). Descomentar
      # ambas líneas SOLO cuando exista una sesión grabada de verdad en
      # `knowledge/sessions/<nombre>/` (`scripts/record_session.py`, runbook
      # de Dylan con su propia key — nunca en este YAML/CI):
      #
      # CHIMERA_MODEL_BACKEND: replay
      # CHIMERA_MODEL_SESSION_DIR: /app/knowledge/sessions/<nombre>
      # P10/M24 — dónde viven los archivos del proyecto (Papers). Volumen,
      # no bind: son contenido direccionado por digest, y perderlos en un
      # rebuild rompería toda cita `ref{name, digest}` que los nombre.
      CHIMERA_FILES_DIR: /app/var/files
      # F1.6 — dónde vive la EVIDENCIA de los runs (`RunResources.content`,
      # lo que `digest_via()` persiste en cada `run.step.started` y llamada
      # de modelo). Plano de confianza DISTINTO a `CHIMERA_FILES_DIR` de
      # arriba (ahí sube el usuario, acá produce el runtime — files.py:73-84
      # ya argumenta esa separación): volumen propio, no compartido. Sin
      # esto la evidencia era in-memory y se evaporaba en cada
      # `docker compose up --build`, que es justo lo que un almacén
      # direccionado por digest no puede hacer.
      CHIMERA_CONTENT_DIR: /app/var/content
      # [C8/M8 pieza 4] Custodia de llaves (escalera del freeze §7, P1-3).
      # AUSENTES por default ⇒ escalón 1 efímero, comportamiento intacto.
      # Con el perfil `custody` levantado, descomentar para que la llave del
      # certificado deje de vivir en la memoria del proceso:
      #
      # CHIMERA_TRANSIT_ADDR: http://openbao:8200
      # CHIMERA_TRANSIT_TOKEN_FILE: /run/secrets/transit_token
      #
      # (y agregar `transit_token` a la lista de `secrets:` de abajo). Definir
      # la dirección SIN el token es fail-closed a propósito: la custodia no
      # se configura a medias.
      #
      # O5/M13 — caché de `uvx` para los servidores MCP externos que declara
      # `distributions/chimera/distribution.yaml`. El usuario del contenedor no
      # tiene HOME escribible (`--no-create-home`, a propósito), así que sin
      # esto `uvx` muere con «failed to create directory /home/chimera/.cache».
      # Volumen y no bind: la caché sobrevive al rebuild, y así el pin se
      # resuelve UNA vez en vez de en cada invocación.
      UV_CACHE_DIR: /app/var/uv-cache
      # `uvx` necesita TRES rutas escribibles, no una: caché, directorio de
      # herramientas y bin. Todas cuelgan del mismo volumen para que el
      # Dockerfile no tenga que conocerlas una por una.
      UV_TOOL_DIR: /app/var/uv-cache/tools
      UV_TOOL_BIN_DIR: /app/var/uv-cache/bin
    volumes:
      - filesdata:/app/var/files
      - contentdata:/app/var/content
      - uvcache:/app/var/uv-cache
    secrets:
      - postgres_password
    ports:
      - '8000:8000'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request as u; u.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # CONFIG-presente-e-INERTE (decisión #6, docs/mvp/decisiones.md): usa la
  # MISMA imagen que `api` con el comando `procrastinate worker`, pero no
  # existe todavía una app procrastinate registrada en el engine (eso es el
  # ítem P11 del backlog: la cola durable detrás del puerto JobQueue).
  #
  # **P5/M27 — arreglo de `docker compose up` (2026-08-02).** Este servicio
  # NO es inofensivo: `procrastinate worker` sin app registrada **FALLA al
  # arrancar**, así que un `docker compose up` pelado —lo primero que hace un
  # tercero siguiendo el quickstart— mostraba un contenedor en crash-loop y
  # un exit code sucio, sin ninguna pista de que era esperado. Eso rompe la
  # autoridad 2 (un externo sin contexto) por una razón puramente cosmética.
  #
  # Solución: PERFIL `queue`. Compose no arranca servicios con `profiles:` a
  # menos que se pidan explícitamente, así que `docker compose up` levanta el
  # stack que de verdad funciona (postgres + api + studio) y el worker espera
  # a que P11 le dé una app. Cuando exista, se saca el perfil — no antes: un
  # servicio declarado como de primera clase que crashea es peor que uno
  # honestamente apagado.
  #
  # Para levantarlo igual (probar la cola cuando llegue): `--profile queue`.
  worker:
    profiles: ['queue']
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ['procrastinate', 'worker']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHIMERA_DB_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password

  # ── Perfil `otel` — observabilidad, OPCIONAL por diseño (S-F §1) ──────────
  # El camino por defecto del stack NO lo incluye: un proyector caído jamás debe
  # poder afectar un run. `docker compose --profile otel up -d` levanta los dos.
  otel-collector:
    profiles: ['otel']
    image: otel/opentelemetry-collector-contrib:0.139.0
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./docker/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      # Solo loopback: el proyector corre en la red del compose; el puerto
      # publicado es para inspeccionar desde el host.
      - '127.0.0.1:4318:4318'

  otel-projector:
    profiles: ['otel']
    build:
      context: .
      dockerfile: docker/otel-projector.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      # Usuario SOLO-SELECT — el DSN se arma acá porque este servicio no
      # comparte el entrypoint del api.
      CHIMERA_OTEL_PASSWORD_FILE: /run/secrets/otel_password
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: chimera-otel-projector
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        CHIMERA_OTEL_DATABASE_URL="postgresql://chimera_otel:$$(cat /run/secrets/otel_password)@postgres:5432/chimera"
        exec python -m chimera_otel
    secrets:
      - otel_password
    volumes:
      - otelcursor:/var/lib/chimera-otel

  studio:
    build:
      context: .
      dockerfile: docker/studio.Dockerfile
      args:
        # VITE_API_URL es la var que de verdad prende el modo vivo del Studio
        # (isLiveMode() en apps/studio/src/data/env.ts). VITE_GATEWAY_URL murió
        # con la ruta fantasma /invoke (hallazgo 7, P-rt 2026-08-02): nginx ahora
        # reverse-proxea solo /runs,/health. http://localhost:3000 es la URL same-origin
        # del propio servicio `studio` vista desde el navegador (puerto
        # publicado 3000:80); nginx reverse-proxea /runs,/health,/invoke al
        # `api` → sin CORS. No puede quedar vacía o el modo vivo nunca se
        # activa. Fragilidad conocida: esto hornea "localhost:3000" en el
        # bundle — demo local canónica por freeze §15.4 ("todo LOCAL"); un
        # refactor a base relativa host-agnóstica queda como follow-up.
        VITE_API_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - '3000:80'

  # [C8/M8 pieza 4] OpenBao Transit — escalón 2 de la custodia (research R3
  # §6). SINGLE INSTANCE a propósito: el quorum de 3 de OpenBao es para ALTA
  # DISPONIBILIDAD, no para seguridad; un nodo con Raft integrado ya da
  # custodia real. Perfil OPCIONAL: `docker compose --profile custody up`.
  #
  # El unseal automatizado vive en `scripts/openbao-init.sh` y guarda las
  # llaves de unseal en el volumen `baodata`. Eso es aceptable para un
  # despliegue local de operador único y NO para producción: ahí las llaves
  # de unseal se custodian fuera de la máquina que las usa, o el sello no
  # protege de nada. El script lo dice en su encabezado, no solo este
  # comentario.
  openbao:
    profiles: ['custody']
    image: openbao/openbao:2.6.1
    # Sin `-config=...`: el entrypoint de la imagen YA carga /openbao/config,
    # y pasarlo explícito hace que lea el mismo archivo dos veces
    # ("ignoring duplicate configuration", verificado en vivo).
    command: ['server']
    # Sin `cap_add: IPC_LOCK`: OpenBao 2.6 eliminó mlock (arranca con error si
    # se configura). Lo que protege el material de llave en memoria pasa a ser
    # el swap del host, cifrado o deshabilitado — ver docker/openbao.hcl.
    volumes:
      - baodata:/openbao/file
      - ./docker/openbao.hcl:/openbao/config/openbao.hcl:ro
    ports:
      - '8200:8200'
    healthcheck:
      # 501 = inicializado pero sellado; 200 = listo. Ambos prueban que el
      # proceso responde — el init/unseal lo hace el script, no el health.
      test: ['CMD', 'bao', 'status', '-address=http://127.0.0.1:8200']
      interval: 5s
      timeout: 3s
      retries: 10

  # [C9/M8 pieza 5 · #105] Testigo de transparencia — `rekor-server-posix`:
  # UN binario y UN disco, sin Fulcio ni CA en línea. El descarte anterior de
  # Rekor (freeze §7, «rompe air-gap») era correcto para la emisión KEYLESS;
  # este perfil registra el certificado ya firmado y devuelve una prueba de
  # inclusión que viaja DENTRO del bundle — verificarla no contacta a nadie
  # (`blite.certificate.transparency`, punto 12 del checklist).
  #
  # ALCANCE DECLARADO: la mitad OFFLINE (verificación de la prueba engrapada)
  # está implementada y probada. El cliente de SUMISIÓN al log no: escribirlo
  # sin ejercitarlo contra un servidor real produce código que falla en el
  # primer contacto — es exactamente lo que pasó con la pública de Transit en
  # C8, y ahí sí había servidor para descubrirlo. Queda en el handoff con su
  # comando.
  rekor:
    profiles: ['transparency']
    image: ghcr.io/sigstore/rekor-tiles/rekor-server:v1.0.0
    command:
      - '--http-address=0.0.0.0'
      - '--http-port=3003'
      - '--storage-backend=posix'
      - '--posix-dir=/var/lib/rekor'
    volumes:
      - rekordata:/var/lib/rekor
    ports:
      - '127.0.0.1:3003:3003'

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  # Token de Transit para el api — lo produce `scripts/openbao-init.sh`.
  # Archivo, jamás env var: una env var viaja en `docker inspect`, en los
  # logs del orquestador y en el entorno de todo proceso hijo.
  transit_token:
    file: ./secrets/transit_token.txt
  otel_password:
    file: ./secrets/otel_password.txt

volumes:
  pgdata: {}
  # Datos de OpenBao (Raft integrado) — perfil `custody`.
  baodata: {}
  # Árbol del log de transparencia — perfil `transparency`.
  rekordata: {}
  # Caché de `uvx` para los servidores MCP externos (O5/M13).
  uvcache: {}
  # Cursor del proyector — FUERA del event store (S-F §2).
  otelcursor: {}
  # P10/M24 — archivos del proyecto (Papers). Direccionados por contenido:
  # sin volumen se perderían en cada rebuild, que es justo lo que un almacén
  # por digest no puede hacer.
  filesdata: {}
  # F1.6 — evidencia de los runs (`RunResources.content`). Volumen PROPIO,
  # no `filesdata`: son dos planos de confianza distintos (papers subidos
  # por el usuario vs. evidencia que el runtime produce y el certificado
  # cita) y perderla en cada rebuild es justo lo que este ítem existe para
  # cerrar.
  contentdata: {}
