# DistributionManifest — lo que ESTE despliegue declara (freeze §1, O5/M13).
#
# Se valida AL CARGAR, no en la primera invocación: un despliegue mal declarado
# tiene que morir cuando alguien está mirando, no a mitad de un run.

version: 1

# ── Servidores MCP externos (resolución C-12) ─────────────────────────────────
#
# Esta lista ES la superficie de interop del despliegue. El vocabulario del
# tercero vive acá, como DATO con digest — jamás en un `CapabilityManifest`
# nuestro. Por eso registrar un servidor nuevo no toca ADR-029: no agrega
# manifest, agrega configuración.
#
# Que un servidor esté permitido NO permite todos sus tools: un servidor MCP
# puede añadir tools entre versiones, y heredar permiso por pertenecer al
# servidor sería aceptar superficie que nadie revisó.
mcp_servers:
  qnexus-mcp:
    transport: stdio
    # PIN exacto: `uvx qnexus-mcp` sin versión trae lo que haya hoy en PyPI, y
    # una capability gobernada no puede depender de eso. Es también lo que la
    # attestation de importación cita como `builder`.
    package_pin: 'qnexus-mcp==0.2.0'
    command: uvx
    args: ['qnexus-mcp==0.2.0']
    # Declarativo: a dónde puede salir ESTE servidor. Lo consume la política de
    # egreso — Inv-E: el egreso lo decide authz, nunca el adapter.
    egress:
      - nexus.quantinuum.com
    # Solo lectura, a propósito. Los tools de gasto y los destructivos de
    # qnexus-mcp exigen flags de arranque propios del servidor; no entran acá
    # sin una decisión registrada que diga por qué.
    tools:
      - nexus_auth_status
      - nexus_whoami
      - nexus_list_devices
      - nexus_device_status
      - nexus_list_projects
      - nexus_get_quota

# ── Datasets publicados (O4/M10, resolución C-13) ─────────────────────────────
#
# El catálogo (`GET /datasets`) sale de acá y de ningún otro lado: la plataforma
# no trae datos, un despliegue los declara. Los nombres de dominio viven en
# ESTE archivo —configuración— y no en el código, que es exactamente lo que
# ADR-029 pide y lo que el gate de agnosticismo verifica.
#
# `license` no tiene default a propósito. Publicar datos sin decir bajo qué
# términos se pueden usar traslada el problema a quien los descargue, que es
# quien menos puede resolverlo.
#
# NO se declara el corpus de `knowledge/islanding/`, y no es un olvido: sus
# instancias tienen procedencia mixta (datos de ejemplo de UN reto, derivados
# de un portal abierto de terceros cuyo catálogo no declara identificador de
# licencia — ver NOTICE §2). Se quedan en el árbol como datos de prueba; un
# dataset que no se puede licenciar con claridad no se publica.
datasets:
  tfim-corpus:
    path: knowledge/tfim/corpus
    title: Transverse-field Ising chain reference series
    description: >-
      Reference observable series for transverse-field Ising chains, produced by
      exact diagonalisation. Each instance carries the Hamiltonian terms, the
      quench protocol and the resulting single-site and two-site series, with an
      embedded digest over its own contents.
    license: https://creativecommons.org/publicdomain/zero/1.0/
    url: https://github.com/Blite-HQ/Chimera/tree/main/knowledge/tfim/corpus
    version: '1.0.0'
    date_published: '2026-08-08'
    cite_as: >-
      Blite-HQ (2026). Transverse-field Ising chain reference series.
      Chimera, version 1.0.0.
      https://github.com/Blite-HQ/Chimera/tree/main/knowledge/tfim/corpus

  tabular-corpus:
    path: knowledge/tabular/corpus
    title: Sealed synthetic tabular classification instance
    description: >-
      A synthetic binary-classification instance sealed before use: generator
      seed, decision boundary, injected noise and missing-cell rate are all
      declared, so the labels cannot have been chosen after seeing a result.
    license: https://creativecommons.org/publicdomain/zero/1.0/
    url: https://github.com/Blite-HQ/Chimera/tree/main/knowledge/tabular/corpus
    version: '1.0.0'
    date_published: '2026-08-08'
    cite_as: >-
      Blite-HQ (2026). Sealed synthetic tabular classification instance.
      Chimera, version 1.0.0.
      https://github.com/Blite-HQ/Chimera/tree/main/knowledge/tabular/corpus
