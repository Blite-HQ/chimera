server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  # index.html JAMÁS se cachea: sin esto el navegador retiene el index viejo
  # (heurística por ETag) y sigue cargando bundles reemplazados tras un
  # redeploy — se reprodujo en vivo en la auditoría Fase 2. Los assets van
  # con hash en el nombre, así que pueden cachearse como inmutables.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  # Reverse-proxy the gateway/api (same-origin → no CORS). SSE-safe.
  #
  # Esta lista es un ALLOWLIST y hay que ampliarla cuando el API gana una ruta
  # de primer nivel: lo que no está acá lo sirve el fallback de la SPA, así que
  # el navegador recibe HTML donde esperaba JSON y el parseo Zod falla con un
  # error que no menciona a nginx. Pasó con `/me` (P6), cazado contra compose.
  #
  # La otra cara de la misma regla: ninguna ruta de la SPA puede empezar con
  # uno de estos prefijos, o nginx se la comería. Por eso el árbol del router
  # (P7) cuelga entero de `/w/…` — hay un test que lo vigila.
  location ~ ^/(runs|health|me|auth|files)(/|$) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;             # SSE: flush frames immediately
    proxy_read_timeout 1h;           # SSE: long-lived stream
    proxy_set_header Connection '';
  }
}
