server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  # Reverse-proxy the gateway/api (same-origin → no CORS). SSE-safe.
  location ~ ^/(invoke|runs|health) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;             # SSE: flush frames immediately
    proxy_read_timeout 1h;           # SSE: long-lived stream
    proxy_set_header Connection '';
  }
}
