[project]
name = "chimera-api"
version = "0.1.0"
description = "API del walking skeleton — SSE de eventos proyectados sobre el puerto EventStore (freeze §9)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chimera-engine",
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
chimera-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_api"]
