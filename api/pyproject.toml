[project]
name = "chimera-api"
version = "0.1.0"
description = "API del walking skeleton — SSE de eventos proyectados sobre el puerto EventStore (freeze §9)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chimera-engine",
    "fastapi>=0.139.2",
    # P3 (chat-conversacion.md §Contrato-7): la respuesta de un approval se
    # valida contra el `json_schema` que el request declaró (forma
    # elicitation MCP = JSON Schema). Implementación de referencia, MIT —
    # escribir un validador propio sería reimplementar un estándar.
    # Estaba disponible transitivamente en el venv; acá queda DECLARADA, que
    # es lo que la vuelve una dependencia real y no un accidente.
    "jsonschema>=4.26",
    # [P11] La cola durable (`chimera_api.jobs`). Estaba declarada en
    # `chimera-engine` desde el MVP —cuando el worker era un servicio inerte
    # del compose y nadie había escrito su app— pero el engine JAMÁS puede
    # importarla: `blite.runtime` define el PUERTO `JobQueue` y el adapter
    # vive afuera (mismo principio que `ModelPort` con litellm, AX3-b). Se
    # mueve acá, que es donde de verdad se importa, y un contrato de
    # import-linter lo vuelve verificable en vez de quedar como intención.
    "procrastinate>=3.9.0",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv.sources]
chimera-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chimera_api"]
