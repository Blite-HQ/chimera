name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (OpenSSF Scorecard "Token-Permissions"): every job
# only gets read access to repo contents unless a step explicitly needs more.
permissions:
  contents: read

jobs:
  # ── Python: lint + types + tests + architecture gates ──────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=xml

      - name: Architecture gates (import-linter)
        run: uv run lint-imports

  # ── Web: lint + types + tests + dep-cruiser ─────────────────────────────────
  web:
    name: Web (Studio)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # pnpm version comes from the root package.json "packageManager" field.
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint (eslint)
        run: pnpm -C apps/studio run lint

      - name: Type check (tsc)
        run: pnpm -C apps/studio run typecheck

      - name: Tests (vitest)
        run: pnpm -C apps/studio run test:run

      # Runs inside apps/studio so dependency-cruiser picks up the co-located
      # .dependency-cruiser.cjs (INV-1 gate) — the config is not at repo root.
      - name: Architecture (dependency-cruiser)
        run: pnpm -C apps/studio exec depcruise src

  # ── Commit messages ───────────────────────────────────────────────────────
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On pull_request events the commitlint action lists the PR's commits
    # via the REST API, which the global contents-only block doesn't allow.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Pinned CLI instead of gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE for organization-owned repos; the CLI does not.
      - name: Scan secrets (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Audit Python deps (pip-audit)
        run: |
          uv sync --locked --all-packages
          # CVE-2025-69872 (diskcache 5.6.3, via dwave-ocean-sdk → the
          # quantum capability's 'dwave' extra): no fixed release exists as
          # of 2026-07-02. Re-evaluate when dependabot bumps dwave/diskcache.
          uv run pip-audit --skip-editable --ignore-vuln CVE-2025-69872

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Audit Node deps (pnpm audit)
        run: |
          pnpm install
          pnpm audit --audit-level=high

  # ── Semgrep (advisory, Tier 2) ───────────────────────────────────────────
  # Not in branch-protection required checks — annotates findings, never
  # blocks. Custom rules in semgrep.yml encode the base lógica (PR2, Inv-E,
  # INV-3, AX3); p/python + p/secrets add general SAST/secret coverage.
  # Registry-sourced packs require metrics, so they run as a separate step
  # and the local rules keep --metrics=off.
  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install semgrep
        run: pip install semgrep==1.168.0

      - name: Semgrep — custom base lógica rules
        continue-on-error: true
        run: semgrep --config semgrep.yml --error --metrics=off .

      - name: Semgrep — registry packs (p/python, p/secrets)
        continue-on-error: true
        run: semgrep --config p/python --config p/secrets --error .

  # ── Docs ──────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Install
        run: pnpm install

      - name: Lint Markdown
        run: pnpm run docs:lint

      - name: Format check (prettier)
        run: pnpm run format:check
