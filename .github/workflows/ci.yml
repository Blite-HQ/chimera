name: CI

on:
  push:
    # mejorado/** añadido por S3 (O1/M25, N8): las ramas de trabajo de la fase
    # también corren CI en push — antes solo main y los PRs.
    branches: [main, 'mejorado/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (OpenSSF Scorecard "Token-Permissions"): every job
# only gets read access to repo contents unless a step explicitly needs more.
permissions:
  contents: read

jobs:
  # ── Change detection — the affected-only gate ───────────────────────────────
  # Lets a docs-only PR skip pytest+pyright+vitest instead of paying for the
  # full Python+Web suite every time. Only python/web/docs are gated on this;
  # commits/security/semgrep stay ungated on purpose (see their comments).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On pull_request events dorny/paths-filter lists changed files via the
    # REST API (the default shallow checkout doesn't have the base commit
    # locally), which the global contents-only block doesn't allow — same
    # reason the "commits" job below needs this.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
      data: ${{ steps.filter.outputs.data }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            python:
              - 'sdk/**'
              - 'engine/**'
              # `api/**` faltaba: un cambio SOLO en la capa HTTP se saltaba
              # pytest/pyright/lint-imports enteros (hallazgo O, 2026-08-05).
              - 'api/**'
              - 'capabilities/**'
              - 'distributions/**'
              - 'tools/**'
              - 'challenges/**'
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-uv/**'
            # Datos ESTAMPADOS: su guard no depende del código, así que no
            # tiene por qué arrastrar la suite de Python entera (O12).
            data:
              - 'knowledge/islanding/corpus/**'
              - 'knowledge/tfim/corpus/**'
              - 'knowledge/tabular/corpus/**'
              - 'knowledge/nexus/**'
              - 'scripts/verify_corpus_digests.py'
              - 'scripts/verify_nexus_digests.py'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/studio/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-pnpm-node/**'
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'knowledge/**'
              - '.markdownlint.json'
              - '.markdownlintignore'
              - '.prettierignore'
              - '.github/workflows/ci.yml'

  # ── Python: lint + types + tests + architecture gates ──────────────────────
  python:
    name: Python
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Architecture gates (import-linter)
        run: uv run lint-imports

  # ── Datos estampados: los digests que nadie puede re-escribir ──────────────
  # La regla («se REPORTA, jamás se sobreescribe») vivía solo en prosa y en un
  # script que había que acordarse de correr. Un corpus editado a mano o un
  # import re-corrido con otro snapshot pasaban sin que nada los viera (O12).
  data:
    name: Data guards
    needs: changes
    if: needs.changes.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Stamped corpora (islanding · TFIM · tabular)
        run: uv run python scripts/verify_corpus_digests.py

      - name: External evidence chain (Nexus)
        run: uv run python scripts/verify_nexus_digests.py

  # ── Web: lint + types + tests + dep-cruiser ─────────────────────────────────
  web:
    name: Web (Studio)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm + Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Install dependencies
        run: pnpm install

      - name: Lint (eslint)
        run: pnpm -C apps/studio run lint

      - name: Type check (tsc)
        run: pnpm -C apps/studio run typecheck

      - name: Tests (vitest)
        run: pnpm -C apps/studio run test:run

      # Runs inside apps/studio so dependency-cruiser picks up the co-located
      # .dependency-cruiser.cjs (INV-1 gate) — the config is not at repo root.
      - name: Architecture (dependency-cruiser)
        run: pnpm -C apps/studio exec depcruise src

  # ── Commit messages ───────────────────────────────────────────────────────
  # Deliberately ungated (no `needs.changes` check): cheap (~10s) and every PR
  # has commits regardless of which paths changed, so skipping it would save
  # negligible time while creating a gap in the one gate that's actually the
  # cheapest to just always run.
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # On pull_request events the commitlint action lists the PR's commits
    # via the REST API, which the global contents-only block doesn't allow.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  # ── PR title (Conventional Commit) ──────────────────────────────────────────
  # With squash-merge, the PR title becomes the commit that lands on main —
  # commitlint above never sees that squashed message. This is the gate that
  # actually protects it, so it's ungated too (every PR has exactly one title).
  pr-title:
    name: PR title (Conventional Commit)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Same type-enum as commitlint.config.cjs — keep in sync.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
            revert

  # ── Security ──────────────────────────────────────────────────────────────
  # Deliberately ungated: gitleaks scans full history regardless of which
  # paths changed in this PR, and a secret can land in any file type — not
  # just python/web.
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Pinned CLI instead of gitleaks-action: the action requires a paid
      # GITLEAKS_LICENSE for organization-owned repos; the CLI does not.
      - name: Scan secrets (gitleaks)
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          # A PATH: lo necesita el test de la config, más abajo en este mismo
          # job — es el único sitio del CI donde el binario existe.
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks git --redact --no-banner .

      - name: Set up uv
        uses: ./.github/actions/setup-uv

      # Las allowlists de `.gitleaks.toml` son lo único que puede QUITAR
      # detección. Se ejercen contra el binario real acá, y no en el job
      # Python, porque allá gitleaks no existe y el test se saltaría en
      # silencio: un guard que se salta no es un guard.
      - name: Test gitleaks allowlists
        run: |
          uv sync --locked --all-packages
          uv run pytest tests/integration/test_gitleaks_config.py --no-cov -q

      - name: Audit Python deps (pip-audit)
        run: |
          # CVE-2025-69872 / PYSEC-2026-2447 (diskcache 5.6.3, via
          # dwave-ocean-sdk → the quantum capability's 'dwave' extra).
          # RE-EVALUATED 2026-08-05 (O, hallazgo 9): pip-audit still reports
          # `fix_versions: []` — upstream has published no fixed release, so
          # the ignore stands. It is not a standing waiver: whoever touches
          # this next re-runs `uv run pip-audit --skip-editable -f json` and
          # drops the flag the moment a fix version appears.
          uv run pip-audit --skip-editable --ignore-vuln CVE-2025-69872

      - name: Set up pnpm + Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Audit Node deps (pnpm audit)
        run: |
          pnpm install
          pnpm audit --audit-level=high

      # All scans above are blocking (job fails before this step if any scan
      # finds something) — this table is a visible confirmation, not a
      # substitute for the gate.
      - name: Security summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Security scans"
            echo "| Scan | Status |"
            echo "| --- | --- |"
            echo "| gitleaks (full history) | ✅ passed |"
            echo "| pip-audit (Python) | ✅ passed |"
            echo "| pnpm audit (--audit-level=high) | ✅ passed |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Semgrep (advisory, Tier 2) ───────────────────────────────────────────
  # Not in branch-protection required checks — annotates findings, never
  # blocks. Custom rules in semgrep.yml encode the base lógica (PR2, Inv-E,
  # INV-3, AX3); p/python + p/secrets add general SAST/secret coverage.
  # Registry-sourced packs require metrics, so they run as a separate step
  # and the local rules keep --metrics=off.
  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install semgrep
        run: pip install semgrep==1.168.0

      - name: Semgrep — custom base lógica rules
        continue-on-error: true
        run: semgrep --config semgrep.yml --error --metrics=off .

      - name: Semgrep — registry packs (p/python, p/secrets)
        continue-on-error: true
        run: semgrep --config p/python --config p/secrets --error .

  # ── Docs ──────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm + Node
        uses: ./.github/actions/setup-pnpm-node

      - name: Install
        run: pnpm install

      - name: Lint Markdown
        run: pnpm run docs:lint

      - name: Format check (prettier)
        run: pnpm run format:check

  # ── CI gate ───────────────────────────────────────────────────────────────
  # The single aggregator job to mark as the required status check once the
  # Ruleset activates (Tier 2 of the hybrid plan). Needed because path-filter
  # gating means python/web/docs can legitimately report "skipped" on a given
  # PR — if any of those were marked required individually, a PR that skips
  # them would sit "pending" forever. This job treats "skipped" as fine and
  # only fails on an actual failure/cancellation of a required job.
  ci-gate:
    name: CI gate
    if: always()
    needs: [python, web, data, commits, pr-title, security, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        run: |
          declare -A results=(
            [python]="${{ needs.python.result }}"
            [web]="${{ needs.web.result }}"
            [data]="${{ needs.data.result }}"
            [commits]="${{ needs.commits.result }}"
            [pr-title]="${{ needs.pr-title.result }}"
            [security]="${{ needs.security.result }}"
            [docs]="${{ needs.docs.result }}"
          )
          failed=0
          for job in "${!results[@]}"; do
            result="${results[$job]}"
            echo "$job: $result"
            # "skipped" is expected when path-filter or the PR-only pr-title
            # job didn't apply — only failure/cancelled should block.
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::Required job '$job' did not succeed ($result)."
              failed=1
            fi
          done
          exit "$failed"
