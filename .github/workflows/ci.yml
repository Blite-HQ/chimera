name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default (OpenSSF Scorecard "Token-Permissions"): every job
# only gets read access to repo contents unless a step explicitly needs more.
permissions:
  contents: read

jobs:
  # ── Python: lint + types + tests + architecture gates ──────────────────────
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests + coverage
        run: uv run pytest --cov --cov-report=xml

      - name: Architecture gates (import-linter)
        run: uv run lint-imports

  # ── Web: lint + types + tests + dep-cruiser ─────────────────────────────────
  web:
    name: Web (Studio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint (eslint)
        run: pnpm -C apps/studio run lint

      - name: Type check (tsc)
        run: pnpm -C apps/studio run typecheck

      - name: Tests (vitest)
        run: pnpm -C apps/studio run test:run

      - name: Architecture (dependency-cruiser)
        run: |
          if [ -d "apps/studio/src" ]; then
            pnpm exec depcruise apps/studio/src --config .dependency-cruiser.cjs
          fi

  # ── Commit messages ───────────────────────────────────────────────────────
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Scan secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Audit Python deps
        run: |
          uv sync --all-packages
          uv run pip-audit --skip-editable || true

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Audit Node deps
        run: pnpm install && pnpm audit --audit-level moderate || true

  # ── Semgrep (advisory, Tier 2) ───────────────────────────────────────────
  # Not in branch-protection required checks — annotates findings, never
  # blocks. Custom rules in semgrep.yml encode the base lógica (PR2, Inv-E,
  # INV-3, AX3); p/python + p/secrets add general SAST/secret coverage.
  semgrep:
    name: Semgrep (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install semgrep
        run: pip install semgrep

      - name: Run semgrep
        continue-on-error: true
        run: |
          semgrep --config semgrep.yml --config p/python --config p/secrets \
            --error --metrics=off .

  # ── Docs ──────────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11

      - name: Install
        run: pnpm install

      - name: Lint Markdown
        run: pnpm run docs:lint
