name: Release Please

# Manifest-driven (release-please-config.json + .release-please-manifest.json),
# scoped to sdk/ (blite-capability) only — the one Python package a third
# party might actually consume today. engine/ and the capabilities stay
# unversioned/internal for now; extend the manifest when that changes.
# Starts at 0.x (unstable API allowed) and only tags + writes a GitHub
# Release + CHANGELOG — it does not publish to PyPI.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
