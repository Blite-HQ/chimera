# Auto-labels PRs by area. Advisory only: labels make the touched area visible,
# they don't gate anything and they don't encode ownership — per-person plano
# owners died with decision #94 (S3, 2026-07-30); CODEOWNERS is now a single
# catch-all. The area globs below remain useful as-is.

verification:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/blite/verification/**'
          - 'engine/src/blite/events/**'
          - 'engine/src/blite/certificate/**'
          - 'engine/src/blite/identity/**'
          - 'engine/src/blite/protocols/**'
          - 'engine/src/blite/guardrails/**'
          - 'engine/src/blite/authz/**'
          - 'sdk/**'

execution:
  - changed-files:
      - any-glob-to-any-file:
          - 'engine/src/blite/gateway/**'
          - 'engine/src/blite/runtime/**'
          - 'engine/src/blite/serving/**'
          - 'apps/studio/**'

quantum:
  - changed-files:
      - any-glob-to-any-file:
          - 'capabilities/quantum/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'scripts/**'
