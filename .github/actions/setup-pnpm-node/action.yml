name: Set up pnpm + Node
description: >
  Install pnpm (version read from the root package.json "packageManager"
  field) and Node with pnpm-aware caching. Factored out because every
  Node-touching job (Web, Security, Docs) repeated this block verbatim.

inputs:
  node-version:
    description: Node version to install.
    required: false
    default: '24'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
