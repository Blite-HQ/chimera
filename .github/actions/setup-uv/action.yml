name: Set up uv
description: >
  Install uv with the pinned Python version and caching enabled. Factored out
  because every Python-touching job (Python, Security) repeated this block
  verbatim.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
