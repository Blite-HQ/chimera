[project]
name = "blite-cap-quantum"
version = "0.1.0"
description = "Quantum optimization via QAOA (Qiskit + Aer, seeded). VQC/VQE descoped — see README."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    # Floor 2.0: qaoa.py usa la API de Qiskit 2.x (QAOAAnsatz sin
    # qiskit_algorithms, qiskit_optimization.translators.to_ising)
    qaoa = ['qiskit>=2.0', 'qiskit-optimization>=0.6', 'qiskit-aer>=0.14']
    vqe = ['qiskit>=1.0', 'qiskit-nature>=0.7', 'pyscf>=2.4']
    vqc = ['pennylane>=0.38']
    dwave = ['dwave-ocean-sdk>=7.0']

[project.entry-points."blite.capabilities"]
"blite.quantum.qaoa" = "blite_cap_quantum:QaoaSolver"
"blite.quantum.trotter_evolve" = "blite_cap_quantum:TrotterEvolve"
"blite.quantum.fidelity_kernel" = "blite_cap_quantum:FidelityKernel"
"blite.quantum.zne" = "blite_cap_quantum:ZeroNoiseExtrapolation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_quantum"]

[tool.uv.sources]
blite-capability = { workspace = true }
