[project]
name = "blite-cap-quantum"
version = "0.1.0"
description = "Quantum computing tools: QAOA optimization, VQC classification, VQE chemistry, circuit simulation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    qaoa = ['qiskit>=1.0', 'qiskit-optimization>=0.6', 'qiskit-aer>=0.14']
    vqe = ['qiskit>=1.0', 'qiskit-nature>=0.7', 'pyscf>=2.4']
    vqc = ['pennylane>=0.38']
    dwave = ['dwave-ocean-sdk>=7.0']

[project.entry-points."blite.capabilities"]
"blite.quantum.qaoa" = "blite_cap_quantum:QaoaSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_quantum"]

[tool.uv.sources]
blite-capability = { workspace = true }
