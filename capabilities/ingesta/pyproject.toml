[project]
name = "blite-cap-ingesta"
version = "0.1.0"
description = "Ingestion: raw snapshot capture and schema-validated derivation into generic graph topology."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
    "geojson-pydantic>=2.1.1",
    "pandera[pandas]>=0.32",
]

[project.entry-points."blite.capabilities"]
"blite.ingesta.snapshot.fetch" = "blite_cap_ingesta:SnapshotFetch"
"blite.ingesta.geojson.to_graph" = "blite_cap_ingesta:GeojsonToGraph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_ingesta"]

[tool.uv.sources]
blite-capability = { workspace = true }
