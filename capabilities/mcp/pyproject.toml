[project]
name = "blite-cap-mcp"
version = "0.1.0"
description = "Invoke a tool on an external MCP server — one generic wrapper, third-party vocabulary as configuration data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.entry-points."blite.capabilities"]
"blite.mcp.invoke_tool" = "blite_cap_mcp:McpToolInvoker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_mcp"]

[tool.uv.sources]
blite-capability = { workspace = true }
