[project]
name = "blite-cap-report"
version = "0.1.0"
description = "Deterministic, byte-reproducible figure and report derivation. Anchor: recompute-and-compare digests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
    "chimera-engine",
]

[project.optional-dependencies]
    plot = ['matplotlib>=3.9']

[project.entry-points."blite.capabilities"]
"blite.report.render_figure" = "blite_cap_report:RenderFigure"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_report"]

[tool.uv.sources]
blite-capability = { workspace = true }
chimera-engine = { workspace = true }
