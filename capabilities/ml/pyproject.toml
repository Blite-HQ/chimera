[project]
name = "blite-cap-ml"
version = "0.1.0"
description = "Classical machine learning: classification, regression, clustering."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    sklearn = ['scikit-learn>=1.5']
    xgboost = ['xgboost>=2.0']

[project.entry-points."blite.capabilities"]
"blite.ml.classify" = "blite_cap_ml:Classifier"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_ml"]

[tool.uv.sources]
blite-capability = { workspace = true }
