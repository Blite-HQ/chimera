[project]
name = "blite-cap-smt"
version = "0.1.0"
description = "SMT/formal verification using Z3. Anchor: formal constraint proofs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    z3 = ['z3-solver>=4.13']

[project.entry-points."blite.capabilities"]
"blite.smt.check_constraints" = "blite_cap_smt:ConstraintChecker"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_smt"]

[tool.uv.sources]
blite-capability = { workspace = true }
