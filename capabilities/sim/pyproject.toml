[project]
name = "blite-cap-sim"
version = "0.1.0"
description = "Domain-independent simulation runners. Anchor: physics-based feasibility verification."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    pandapower = ['pandapower>=3.5.4']

[project.entry-points."blite.capabilities"]
"blite.sim.power_flow" = "blite_cap_sim:PowerFlowSim"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_sim", "src/capabilities_sim_api"]

[tool.uv.sources]
blite-capability = { workspace = true }
