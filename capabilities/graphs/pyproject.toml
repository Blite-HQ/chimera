[project]
name = "blite-cap-graphs"
version = "0.1.0"
description = "Graph algorithms: partitioning, centrality, flow, matching."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    networkx = ['networkx>=3.0']
    gw = ['cvxpy>=1.9.2,<2']

[project.entry-points."blite.capabilities"]
"blite.graphs.partition" = "blite_cap_graphs:GraphPartitioner"
"blite.graphs.maxcut" = "blite_cap_graphs:MaxCutBaseline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_graphs"]

[tool.uv.sources]
blite-capability = { workspace = true }
