[project]
name = "blite-cap-numeric"
version = "0.1.0"
description = "Numerical computation and data preprocessing utilities."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    full = ['numpy>=1.26', 'scipy>=1.13', 'pandas>=3.0.2']

[project.entry-points."blite.capabilities"]
"blite.numeric.matrix_ops" = "blite_cap_numeric:MatrixOps"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_numeric"]

[tool.uv.sources]
blite-capability = { workspace = true }
