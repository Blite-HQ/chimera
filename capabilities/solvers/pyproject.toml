[project]
name = "blite-cap-solvers"
version = "0.1.0"
description = "Classical optimization solvers (QUBO/MILP/CP). Anchor: produces optimal exact solutions (INV-2 role)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "blite-capability",
]

[project.optional-dependencies]
    ortools = ['ortools>=9.0']
    gurobi = ['gurobipy>=11.0']
    # G5: backend='sa' (Simulated Annealing). Hoy nos llega de rebote por el
    # extra `dwave` de blite-cap-quantum (dwave-ocean-sdk); esto declara la
    # dependencia directa que este paquete de verdad usa (dwave.samplers,
    # no neal — ver blite_cap_solvers/qubo.py).
    dwave = ['dwave-samplers>=1.8']

[project.entry-points."blite.capabilities"]
"blite.solvers.qubo" = "blite_cap_solvers:QuboSolver"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blite_cap_solvers"]

[tool.uv.sources]
blite-capability = { workspace = true }
